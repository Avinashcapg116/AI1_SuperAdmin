name: Ai1 Super App CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated test suite
      run: |
        PYTHONPATH=. pytest tests/test_all_modules.py -v --durations=10

    - name: Verify static assets
      run: |
        test -f frontend/index.html
        test -f frontend/styles.css
        test -f frontend/app.js
        test -f frontend/manifest.json
        echo "Static assets verified successfully."
